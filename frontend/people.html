<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find People — Study Group Finder</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(37,99,235,0.12), transparent 20%),
        radial-gradient(circle at 82% 16%, rgba(20,184,166,0.12), transparent 18%),
        linear-gradient(180deg, #f8fbff 0%, #f4f8ff 48%, #eef4ff 100%);
      color: var(--text);
      overflow-x: hidden;
    }
    .nav { display:flex; align-items:center; justify-content:space-between; padding:16px 22px; color:var(--text); background: rgba(255,255,255,0.92); border:1px solid rgba(15,23,42,0.08); border-radius:24px; box-shadow: 0 18px 45px rgba(15,23,42,0.08); backdrop-filter: blur(10px); }
    .logo { font-size:18px; font-weight:800; color:var(--text); }
    .logo span { color:var(--accent); }
    .nav-links { display:flex; gap:12px; align-items:center; flex-wrap: wrap; }
    .nav-link { font-size:13px; color:var(--muted); text-decoration:none; padding:0.5rem 0.8rem; border-radius:999px; transition: all 0.18s ease; }
    .nav-link.active, .nav-link:hover { color:var(--accent-dark); background: rgba(37,99,235,0.08); }
    .avatar { width:40px; height:40px; border-radius:999px; background:linear-gradient(135deg, rgba(37,99,235,0.16), rgba(20,184,166,0.16)); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-weight:700; }

    .main { max-width:1100px; margin:28px auto; padding:18px; }
    .page-title { font-size: clamp(1.7rem, 2.2vw, 2.3rem); font-weight:800; color:var(--text); margin-bottom:0.4rem; }
    .page-sub { font-size:14px; color:var(--muted); margin-top:6px; line-height:1.7; }

    .search-bar { display:grid; grid-template-columns: minmax(0, 1fr) 190px auto; gap:12px; align-items:center; padding:16px; border-radius:24px; background:var(--surface); box-shadow:0 20px 44px rgba(15,23,42,0.07); border:1px solid var(--border); margin:18px 0; }
    .search-input, .filter-select { width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--border); background:var(--surface-soft); color:var(--text); font-size:0.95rem; }
    .search-input:focus, .filter-select:focus { outline:none; border-color: rgba(37,99,235,0.3); box-shadow:0 0 0 4px rgba(37,99,235,0.1); }
    .btn-search { padding:10px 16px; border-radius:14px; border:0; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:white; font-weight:700; cursor:pointer; box-shadow:0 12px 24px rgba(37,99,235,0.16); transition: transform 0.18s ease, box-shadow 0.18s ease; }
    .btn-search:hover { transform: translateY(-1px); box-shadow:0 16px 28px rgba(37,99,235,0.2); }

    .results { display:flex; flex-direction:column; gap:12px; }
    .person-card { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border-radius:20px; background:var(--surface); border:1px solid var(--border); box-shadow:0 16px 36px rgba(15,23,42,0.06); transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; }
    .person-card:hover { transform: translateY(-2px); border-color: rgba(37,99,235,0.18); box-shadow:0 20px 40px rgba(15,23,42,0.08); }
    .person-left { display:flex; align-items:center; gap:12px; }
    .person-avatar { width:54px; height:54px; border-radius:999px; background:linear-gradient(135deg, rgba(37,99,235,0.16), rgba(20,184,166,0.12)); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; border:1px solid rgba(255,255,255,0.8); }
    .person-name { font-size:16px; font-weight:700; color:var(--text); }
    .person-info { font-size:13px; color:var(--muted); }
    .person-units { display:flex; gap:8px; flex-wrap:wrap; margin-top:7px; }
    .unit-tag { background:rgba(37,99,235,0.06); color:var(--accent); border:1px solid rgba(37,99,235,0.12); padding:6px 8px; border-radius:999px; font-weight:600; }
    .shared-tag { background:rgba(22,163,74,0.08); color:var(--success); border:1px solid rgba(22,163,74,0.16); padding:6px 8px; border-radius:999px; font-weight:700; }
    .person-meta { display:flex; align-items:center; justify-content:flex-end; }
    .shared-pill, .neutral-pill { padding:6px 10px; border-radius:999px; font-size:0.8rem; font-weight:700; white-space:nowrap; }
    .shared-pill { background:rgba(22,163,74,0.08); color:var(--success); border:1px solid rgba(22,163,74,0.16); }
    .neutral-pill { background:rgba(37,99,235,0.06); color:var(--accent); border:1px solid rgba(37,99,235,0.12); }

    .empty, .hint { text-align:center; padding:36px; border-radius:20px; background:var(--surface); color:var(--muted); border:1px solid var(--border); }
    .results-count { font-size:13px; color:var(--muted); margin-bottom:8px; font-weight:600; }

    @media (max-width:900px){ .nav { padding:12px; } .main{ padding:12px } .search-bar{ grid-template-columns: 1fr; } .person-avatar{ width:44px;height:44px } }
  </style>
</head>
<body>

<nav class="nav">
  <div class="logo">Study Group <span>Finder</span></div>
  <div class="nav-links">
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link" href="browse.html">Browse groups</a>
    <span class="nav-link active">Find people</span>
    <a class="nav-link" href="notifications.html">Notifications</a>
    <a class="nav-link" href="profile.html">Profile</a>
    <div class="avatar" id="avatar">?</div>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</nav>

<div class="main">
  <div class="page-title">Find People</div>
  <div class="page-sub">Search for students by name or course unit.</div>

  <div class="search-bar">
    <input class="search-input" id="search-input" placeholder="Search by name..." onkeydown="if(event.key==='Enter') search()" />
    <select class="filter-select" id="unit-filter">
      <option value="">All units</option>
    </select>
    <button class="btn-search" onclick="search()">Search</button>
  </div>

  <div id="results-count" class="results-count" style="display:none"></div>
  <div class="results" id="results">
    <div class="hint">Search by name or filter by unit to find students.</div>
  </div>
</div>

<script>
  const API = 'https://study-group-finder-api.onrender.com';
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || 'null');

  if (!token || !user) window.location.href = 'index.html';

  document.getElementById('avatar').textContent = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  }

  function getInitials(name) {
    return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
  }

  async function loadUnits() {
    try {
      const res = await fetch(`${API}/units/all`);
      const data = await res.json();
      const sel = document.getElementById('unit-filter');
      (data.units || []).forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.code;
        opt.textContent = u.code;
        sel.appendChild(opt);
      });
    } catch (err) { console.error(err); }
  }

  async function search() {
    const query = document.getElementById('search-input').value.trim();
    const unit = document.getElementById('unit-filter').value;

    if (!query && !unit) {
      document.getElementById('results').innerHTML = '<div class="hint">Enter a name or select a unit to search.</div>';
      document.getElementById('results-count').style.display = 'none';
      return;
    }

    document.getElementById('results').innerHTML = '<div class="hint">Searching...</div>';

    try {
      const params = new URLSearchParams();
      if (query) params.append('q', query);
      if (unit) params.append('unit', unit);

      const res = await fetch(`${API}/people/search?${params}`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      const people = data.people || [];

      const countEl = document.getElementById('results-count');
      countEl.style.display = 'block';
      countEl.textContent = people.length === 0 ? 'No students found.' : `${people.length} student${people.length === 1 ? '' : 's'} found`;

      if (people.length === 0) {
        document.getElementById('results').innerHTML = '<div class="empty">No students found matching your search.</div>';
        return;
      }

      document.getElementById('results').innerHTML = people.map(p => {
        const units = p.units || [];
        const sharedUnits = p.shared_units || [];
        return `
          <div class="person-card">
            <div class="person-left">
              <div class="person-avatar">${getInitials(p.name)}</div>
              <div>
                <div class="person-name">${p.name}</div>
                <div class="person-info">${p.programme || 'USIU-Africa'} · Year ${p.year_of_study || '—'}</div>
                <div class="person-units">
                  ${sharedUnits.map(u => `<span class="shared-tag">✓ ${u}</span>`).join('')}
                  ${units.filter(u => !sharedUnits.includes(u)).map(u => `<span class="unit-tag">${u}</span>`).join('')}
                </div>
              </div>
            </div>
            <div class="person-meta">
              ${sharedUnits.length > 0 ? `<span class="shared-pill">${sharedUnits.length} shared</span>` : '<span class="neutral-pill">New connection</span>'}
            </div>
          </div>`;
      }).join('');
    } catch (err) {
      console.error(err);
      document.getElementById('results').innerHTML = '<div class="empty">Failed to search. Please try again.</div>';
    }
  }

  loadUnits();
</script>
</body>
</html>
