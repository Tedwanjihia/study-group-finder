<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find People — Study Group Finder</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    .nav { display:flex; align-items:center; justify-content:space-between; padding:18px 24px; color:var(--surface); }
    .logo { font-size:18px; font-weight:700; color:var(--surface); }
    .logo span { color:var(--accent); }
    .nav-links { display:flex; gap:16px; align-items:center; }
    .nav-link { font-size:13px; color:var(--surface-soft); text-decoration:none; opacity:0.95; }
    .nav-link.active { color:var(--accent); font-weight:600; }
    .avatar { width:36px; height:36px; border-radius:999px; background:linear-gradient(90deg, rgba(255,255,255,0.9), rgba(255,255,255,0.85)); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-weight:700; }

    .main { max-width:1100px; margin:28px auto; padding:18px; }
    .page-title { font-size:22px; font-weight:700; color:var(--surface); }
    .page-sub { font-size:14px; color:var(--muted); margin-top:6px; }

    .search-card { display:flex; gap:12px; align-items:center; padding:14px; border-radius:12px; background:var(--surface); box-shadow:var(--shadow); border:1px solid var(--border); margin:18px 0; }
    .search-input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-soft); color:var(--text); }
    .filter-select { padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-soft); color:var(--text); }
    .btn-search { padding:10px 14px; border-radius:10px; border:0; background:linear-gradient(90deg,var(--accent),var(--accent-dark)); color:white; font-weight:600; cursor:pointer; }

    .results { display:flex; flex-direction:column; gap:12px; }
    .person-card { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px; border-radius:12px; background:var(--surface); border:1px solid var(--border); box-shadow:0 12px 30px rgba(2,8,23,0.06); }
    .person-left { display:flex; align-items:center; gap:12px; }
    .person-avatar { width:52px; height:52px; border-radius:999px; background:linear-gradient(180deg,var(--surface-soft), rgba(255,255,255,0.95)); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; }
    .person-name { font-size:16px; font-weight:700; color:var(--text); }
    .person-info { font-size:13px; color:var(--muted); }
    .person-units { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
    .unit-tag { background:transparent; color:var(--accent); border:1px solid rgba(59,130,246,0.12); padding:6px 8px; border-radius:999px; font-weight:600; }
    .shared-tag { background:transparent; color:var(--success); border:1px solid rgba(16,185,129,0.08); padding:6px 8px; border-radius:999px; font-weight:700; }

    .empty, .hint { text-align:center; padding:36px; border-radius:12px; background:var(--surface); color:var(--muted); border:1px solid var(--border); }
    .results-count { font-size:13px; color:var(--muted); margin-bottom:8px; }

    @media (max-width:900px){ .nav { padding:12px; } .main{ padding:12px } .person-avatar{ width:44px;height:44px } }
  </style>
</head>
<body>

<nav class="nav">
  <div class="logo">Study Group <span>Finder</span></div>
  <div class="nav-links">
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link" href="browse.html">Browse groups</a>
    <span class="nav-link active">Find people</span>
    <a class="nav-link" href="notifications.html">Notifications</a>
    <a class="nav-link" href="profile.html">Profile</a>
    <div class="avatar" id="avatar">?</div>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</nav>

<div class="main">
  <div class="page-title">Find People</div>
  <div class="page-sub">Search for students by name or course unit.</div>

  <div class="search-bar">
    <input class="search-input" id="search-input" placeholder="Search by name..." onkeydown="if(event.key==='Enter') search()" />
    <select class="filter-select" id="unit-filter">
      <option value="">All units</option>
    </select>
    <button class="btn-search" onclick="search()">Search</button>
  </div>

  <div id="results-count" class="results-count" style="display:none"></div>
  <div class="results" id="results">
    <div class="hint">Search by name or filter by unit to find students.</div>
  </div>
</div>

<script>
  const API = 'https://study-group-finder-api.onrender.com';
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || 'null');

  if (!token || !user) window.location.href = 'index.html';

  document.getElementById('avatar').textContent = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  }

  function getInitials(name) {
    return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
  }

  async function loadUnits() {
    try {
      const res = await fetch(`${API}/units/all`);
      const data = await res.json();
      const sel = document.getElementById('unit-filter');
      (data.units || []).forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.code;
        opt.textContent = u.code;
        sel.appendChild(opt);
      });
    } catch (err) { console.error(err); }
  }

  async function search() {
    const query = document.getElementById('search-input').value.trim();
    const unit = document.getElementById('unit-filter').value;

    if (!query && !unit) {
      document.getElementById('results').innerHTML = '<div class="hint">Enter a name or select a unit to search.</div>';
      document.getElementById('results-count').style.display = 'none';
      return;
    }

    document.getElementById('results').innerHTML = '<div class="hint">Searching...</div>';

    try {
      const params = new URLSearchParams();
      if (query) params.append('q', query);
      if (unit) params.append('unit', unit);

      const res = await fetch(`${API}/people/search?${params}`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      const people = data.people || [];

      const countEl = document.getElementById('results-count');
      countEl.style.display = 'block';
      countEl.textContent = people.length === 0 ? 'No students found.' : `${people.length} student${people.length === 1 ? '' : 's'} found`;

      if (people.length === 0) {
        document.getElementById('results').innerHTML = '<div class="empty">No students found matching your search.</div>';
        return;
      }

      document.getElementById('results').innerHTML = people.map(p => {
        const units = p.units || [];
        const sharedUnits = p.shared_units || [];
        return `
          <div class="person-card">
            <div class="person-left">
              <div class="person-avatar">${getInitials(p.name)}</div>
              <div>
                <div class="person-name">${p.name}</div>
                <div class="person-info">${p.programme || 'USIU-Africa'} · Year ${p.year_of_study || '—'}</div>
                <div class="person-units">
                  ${sharedUnits.map(u => `<span class="shared-tag">✓ ${u}</span>`).join('')}
                  ${units.filter(u => !sharedUnits.includes(u)).map(u => `<span class="unit-tag">${u}</span>`).join('')}
                </div>
              </div>
            </div>
          </div>`;
      }).join('');
    } catch (err) {
      console.error(err);
      document.getElementById('results').innerHTML = '<div class="empty">Failed to search. Please try again.</div>';
    }
  }

  loadUnits();
</script>
</body>
</html>
