<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group — Study Group Finder</title>
  <style>
.chat-box { display: flex; flex-direction: column; height: 420px; }
.chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 4px 12px; }
.msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.4; }
.msg-mine { align-self: flex-end; background: #185fa5; color: white; }
.msg-other { align-self: flex-start; background: #f5f5f0; color: #1a1a1a; }
.msg-sender { font-size: 11px; font-weight: 600; margin-bottom: 3px; opacity: 0.8; }
.msg-time { font-size: 10px; opacity: 0.6; margin-top: 3px; }
.chat-input-row { display: flex; gap: 8px; margin-top: 12px; }
.chat-input { flex: 1; padding: 10px 12px; border: 1px solid #e0e0d8; border-radius: 8px; font-size: 13px; outline: none; }
.chat-input:focus { border-color: #185fa5; }
.chat-send { padding: 10px 18px; background: #185fa5; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
.chat-send:hover { background: #0c447c; }
.chat-send:disabled { background: #aaa; cursor: not-allowed; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f0; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: white; border-bottom: 1px solid #e0e0d8; }
    .logo { font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .logo span { color: #185fa5; }
    .nav-links { display: flex; align-items: center; gap: 20px; }
    .nav-link { font-size: 13px; color: #888; text-decoration: none; cursor: pointer; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: #e6f1fb; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #185fa5; }
    .main { max-width: 720px; margin: 0 auto; padding: 28px 20px; }
    .back { font-size: 13px; color: #185fa5; cursor: pointer; margin-bottom: 20px; display: inline-block; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .card { background: white; border: 1px solid #e0e0d8; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
    .group-name { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .group-unit { font-size: 14px; color: #185fa5; margin-bottom: 16px; }
    .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .meta-item { background: #f5f5f0; border-radius: 8px; padding: 12px; }
    .meta-label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .meta-val { font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .btn { padding: 9px 20px; background: #185fa5; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn:hover { background: #0c447c; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .btn-danger { padding: 9px 20px; background: white; color: #a32d2d; border: 1px solid #a32d2d; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .btn-danger:hover { background: #fff0f0; }
    .btn-outline { padding: 9px 20px; background: white; color: #888; border: 1px solid #e0e0d8; border-radius: 8px; font-size: 13px; cursor: not-allowed; }
    .section-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #f0f0e8; }
    .member-list { display: flex; flex-direction: column; gap: 8px; }
    .member { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid #e0e0d8; border-radius: 8px; background: white; }
    .member-avatar { width: 36px; height: 36px; border-radius: 50%; background: #e6f1fb; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #185fa5; flex-shrink: 0; }
    .member-name { font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .member-info { font-size: 12px; color: #888; }
    .badge-creator { background: #e6f1fb; color: #185fa5; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }
    .badge-open { background: #f0fff4; color: #276749; font-size: 12px; padding: 3px 10px; border-radius: 20px; }
    .badge-full { background: #fff0f0; color: #a32d2d; font-size: 12px; padding: 3px 10px; border-radius: 20px; }
    .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a1a; color: white; padding: 12px 20px; border-radius: 8px; font-size: 13px; display: none; z-index: 999; }
    .toast.success { background: #276749; }
    .toast.error { background: #a32d2d; }
    .logout { font-size: 13px; color: #e24b4a; cursor: pointer; background: none; border: none; }
    .empty { text-align: center; padding: 24px; color: #888; font-size: 14px; }
    .stars { display: flex; gap: 4px; font-size: 22px; cursor: pointer; }
.star { color: #ddd; transition: color 0.15s; }
.star.filled { color: #f5a623; }
.star:hover, .star.hover { color: #f5a623; }
.rating-summary { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.rating-avg { font-size: 20px; font-weight: 600; color: #1a1a1a; }
.rating-count { font-size: 13px; color: #888; }
.review-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.review { padding: 12px; border: 1px solid #e0e0d8; border-radius: 8px; background: white; }
.review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.review-name { font-size: 13px; font-weight: 600; color: #1a1a1a; }
.review-stars { font-size: 13px; color: #f5a623; }
.review-comment { font-size: 13px; color: #555; margin-top: 4px; }
.review-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.review-textarea { padding: 10px 12px; border: 1px solid #e0e0d8; border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 60px; }
.review-textarea:focus { border-color: #185fa5; outline: none; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="logo">Study Group <span>Finder</span></div>
  <div class="nav-links">
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link" href="browse.html">Browse groups</a>
    <a class="nav-link" href="notifications.html">Notifications</a>
    <a class="nav-link" href="profile.html">Profile</a>
    <div class="avatar" id="avatar">?</div>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</nav>

<div class="main">
  <a class="back" href="browse.html">← Back to groups</a>

  <div class="card" id="group-info">
    <div class="empty">Loading group...</div>
  </div>

  <div class="card" id="request-card" style="display:none">
    <div class="section-title">Join requests</div>
    <div class="member-list" id="request-list">
      <div class="empty">Loading join requests...</div>
    </div>
  </div>

<div class="card">
  <div class="section-title">Group chat</div>
  <div class="chat-box">
    <div class="chat-messages" id="chat-messages">
      <div class="empty">Loading messages...</div>
    </div>
    <div class="chat-input-row">
      <input type="text" class="chat-input" id="chat-input" placeholder="Write a message..." maxlength="500" onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="chat-send" id="chat-send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

  <div class="card">
    <div class="section-title" id="members-title">Members</div>
    <div class="member-list" id="member-list">
      <div class="empty">Loading members...</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="section-title">Ratings & reviews</div>
  <div class="rating-summary" id="rating-summary">
    <div class="empty">Loading ratings...</div>
  </div>

  <div class="review-form" id="review-form" style="display:none">
    <div class="stars" id="star-input">
      <span class="star" data-val="1">★</span>
      <span class="star" data-val="2">★</span>
      <span class="star" data-val="3">★</span>
      <span class="star" data-val="4">★</span>
      <span class="star" data-val="5">★</span>
    </div>
    <textarea class="review-textarea" id="review-comment" placeholder="Share your experience with this group (optional)" maxlength="300"></textarea>
    <button class="btn" style="width:fit-content" onclick="submitReview()">Submit review</button>
  </div>

  <div class="review-list" id="review-list"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  const API = window.location.hostname.includes('localhost') ? 'http://localhost:3000' : 'https://study-group-finder-api.onrender.com';
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || 'null');

  if (!token || !user) window.location.href = 'index.html';

  document.getElementById('avatar').textContent = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

  const params = new URLSearchParams(window.location.search);
  const groupId = params.get('id');

  if (!groupId) window.location.href = 'browse.html';

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
  }

  function getInitials(name) {
    return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
  }

  let groupData = null;
  let messages = [];
  let selectedRating = 0;

  const socket = io(API, {
    auth: { token }
  });

  socket.on('connect', () => {
    if (groupId) {
      socket.emit('joinGroupRoom', groupId);
    }
  });

  socket.on('connect_error', err => {
    console.error('Socket connect error:', err);
    if (err.message === 'Authentication error') {
      showToast('Chat authentication failed. Please sign in again.', 'error');
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      setTimeout(() => window.location.href = 'index.html', 1200);
    }
  });

  socket.on('groupMessage', msg => {
    if (!msg || !msg.id) return;
    messages.push(msg);
    renderMessages(messages);
  });

  async function loadGroup() {
    try {
      const res = await fetch(`${API}/groups/${groupId}`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) return window.location.href = 'index.html';
      const data = await res.json();
      if (!res.ok || !data.group) {
        document.getElementById('group-info').innerHTML = '<div class="empty">Group not found or access denied.</div>';
        return;
      }
      groupData = data.group;
      renderGroupInfo(groupData);
      renderMembers(data.members || []);
      updateChatState(groupData);
      if (groupData.is_creator) {
        loadRequests();
      } else {
        document.getElementById('request-card')?.remove();
      }
    } catch (err) {
      console.error(err);
      document.getElementById('group-info').innerHTML = '<div class="empty">Failed to load group.</div>';
    }
  }

  function renderGroupInfo(g) {
    const count = parseInt(g.member_count) || 0;
    const isFull = count >= g.max_members;
    const isCreator = g.is_creator;
    const isMember = g.is_member;
    const hasPendingRequest = g.has_pending_request;

    let actionBtn = '';
    if (isCreator) {
      actionBtn = '<button class="btn-outline" disabled>You created this group</button>';
    } else if (isMember) {
      actionBtn = `<button class="btn-danger" onclick="leaveGroup()">Leave group</button>`;
    } else if (hasPendingRequest) {
      actionBtn = '<button class="btn-outline" disabled>Join request pending</button>';
    } else if (isFull) {
      actionBtn = '<button class="btn-outline" disabled>Group is full</button>';
    } else {
      actionBtn = `<button class="btn" onclick="joinGroup()">Request to join</button>`;
    }

    const pendingNotice = isCreator && g.pending_count > 0
      ? `<div class="meta-item"><div class="meta-label">Pending</div><div class="meta-val">${g.pending_count} request${g.pending_count === 1 ? '' : 's'}</div></div>`
      : '';

    document.getElementById('group-info').innerHTML = `
      <div class="group-name">${g.name}</div>
      <div class="group-unit">${g.unit_code} — ${g.unit_name}</div>
      <div class="status-row">
        <span class="${isFull ? 'badge-full' : 'badge-open'}">${isFull ? 'Full' : 'Open'}</span>
        ${actionBtn}
      </div>
      <div class="meta-grid">
        <div class="meta-item">
          <div class="meta-label">Members</div>
          <div class="meta-val">${count} / ${g.max_members}</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Schedule</div>
          <div class="meta-val">${g.schedule || 'TBD'}</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Venue</div>
          <div class="meta-val">${g.venue || 'TBD'}</div>
        </div>
        ${pendingNotice}
      </div>`;
  }

  function renderMembers(members) {
    document.getElementById('members-title').textContent = `Members (${members.length})`;
    const ml = document.getElementById('member-list');
    if (members.length === 0) {
      ml.innerHTML = '<div class="empty">No members yet.</div>';
      return;
    }
    ml.innerHTML = members.map(m => `
      <div class="member">
        <div class="member-avatar">${getInitials(m.name)}</div>
        <div>
          <div class="member-name">
            ${m.name}
            ${m.id === groupData.creator_id ? '<span class="badge-creator">Creator</span>' : ''}
          </div>
          <div class="member-info">${m.programme || 'USIU-Africa'} · Year ${m.year_of_study || '—'}</div>
        </div>
      </div>`).join('');
  }

  async function joinGroup() {
    try {
      const res = await fetch(`${API}/groups/${groupId}/join`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) return window.location.href = 'index.html';
      const data = await res.json();
      if (!res.ok) return showToast(data.message, 'error');
      showToast(data.message || 'Join request submitted.', 'success');
      loadGroup();
    } catch (err) {
      showToast('Server error.', 'error');
    }
  }

  async function leaveGroup() {
    if (!confirm('Are you sure you want to leave this group?')) return;
    try {
      const res = await fetch(`${API}/groups/${groupId}/leave`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) return window.location.href = 'index.html';
      const data = await res.json();
      if (!res.ok) return showToast(data.message, 'error');
      showToast(data.message || 'You have left the group.', 'success');
      loadGroup();
    } catch (err) {
      showToast('Server error.', 'error');
    }
  }

  async function loadMessages() {
    try {
      const res = await fetch(`${API}/groups/${groupId}/messages`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) return window.location.href = 'index.html';
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('chat-messages').innerHTML = `<div class="empty">${data.message}</div>`;
        return;
      }
      messages = data.messages || [];
      renderMessages(messages);
    } catch (err) {
      document.getElementById('chat-messages').innerHTML = '<div class="empty">Could not load messages.</div>';
    }
  }

  function renderMessages(messageList) {
    const box = document.getElementById('chat-messages');
    if (!messageList || messageList.length === 0) {
      box.innerHTML = '<div class="empty">No messages yet. Say hello!</div>';
      return;
    }
    const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.innerHTML = messageList.map(m => {
      const mine = m.user_id === user.id;
      const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return `
        <div class="msg ${mine ? 'msg-mine' : 'msg-other'}">
          ${mine ? '' : `<div class="msg-sender">${m.name}</div>`}
          ${escapeHtml(m.message)}
          <div class="msg-time">${time}</div>
        </div>`;
    }).join('');
    if (wasAtBottom || messageList.length <= 1) box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateChatState(g) {
    if (!g.is_member && !g.is_creator) {
      setChatDisabled(true, 'Join this group to participate in the chat.');
    } else {
      setChatDisabled(false);
      if (socket.connected) {
        socket.emit('joinGroupRoom', groupId);
      }
    }
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const btn = document.getElementById('chat-send-btn');
    const text = input.value.trim();
    if (!text) return;
    if (!socket.connected) {
      showToast('Chat connection is offline.', 'error');
      return;
    }
    btn.disabled = true;
    socket.emit('groupMessage', { groupId, message: text }, response => {
      btn.disabled = false;
      if (!response) {
        showToast('Message failed to send.', 'error');
        return;
      }
      if (response.status !== 'ok') {
        showToast(response.message || 'Message failed.', 'error');
        return;
      }
      input.value = '';
      showToast('Message sent.', 'success');
    });
  }

  async function loadRequests() {
    try {
      const res = await fetch(`${API}/groups/${groupId}/requests`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) return window.location.href = 'index.html';
      const data = await res.json();
      const section = document.getElementById('request-card');
      if (!res.ok) {
        if (section) section.style.display = 'none';
        return;
      }
      if (section) section.style.display = 'block';
      renderRequests(data.requests || []);
    } catch (err) {
      console.error(err);
      const section = document.getElementById('request-card');
      if (section) section.style.display = 'none';
    }
  }

  function renderRequests(requests) {
    const section = document.getElementById('request-card');
    if (!section) return;
    section.style.display = 'block';
    const list = section.querySelector('#request-list');
    if (!requests || requests.length === 0) {
      list.innerHTML = '<div class="empty">No pending join requests.</div>';
      return;
    }
    list.innerHTML = requests.map(r => `
      <div class="member">
        <div class="member-avatar">${getInitials(r.name)}</div>
        <div style="flex:1;">
          <div class="member-name">${r.name}</div>
          <div class="member-info">${r.programme || 'USIU-Africa'} · Year ${r.year_of_study || '—'}</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn" onclick="approveRequest(${groupId}, ${r.id})">Approve</button>
          <button class="btn-danger" onclick="rejectRequest(${groupId}, ${r.id})">Reject</button>
        </div>
      </div>`).join('');
  }

  async function approveRequest(groupIdParam, requestId) {
    try {
      const res = await fetch(`${API}/groups/${groupIdParam}/requests/${requestId}/approve`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (!res.ok) return showToast(data.message, 'error');
      showToast('Request approved.', 'success');
      loadGroup();
    } catch (err) {
      showToast('Could not approve request.', 'error');
    }
  }

  async function rejectRequest(groupIdParam, requestId) {
    try {
      const res = await fetch(`${API}/groups/${groupIdParam}/requests/${requestId}/reject`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (!res.ok) return showToast(data.message, 'error');
      showToast('Request rejected.', 'success');
      loadGroup();
    } catch (err) {
      showToast('Could not reject request.', 'error');
    }
  }

  function setChatDisabled(disabled, message) {
    const input = document.getElementById('chat-input');
    const btn = document.getElementById('chat-send-btn');
    input.disabled = disabled;
    btn.disabled = disabled;
    input.placeholder = disabled ? (message || 'Join the group to chat.') : 'Write a message...';
  }

  function initStarInput() {
    const stars = document.querySelectorAll('#star-input .star');
    stars.forEach(star => {
      star.addEventListener('mouseenter', () => highlightStars(parseInt(star.dataset.val)));
      star.addEventListener('mouseleave', () => highlightStars(selectedRating));
      star.addEventListener('click', () => {
        selectedRating = parseInt(star.dataset.val);
        highlightStars(selectedRating);
      });
    });
  }

  function highlightStars(count) {
    document.querySelectorAll('#star-input .star').forEach(star => {
      star.classList.toggle('filled', parseInt(star.dataset.val) <= count);
    });
  }

  async function loadReviews() {
    try {
      const res = await fetch(`${API}/groups/${groupId}/reviews`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (!res.ok) return;

      const summary = document.getElementById('rating-summary');
      if (data.review_count === 0) {
        summary.innerHTML = '<div class="rating-count">No reviews yet — be the first!</div>';
      } else {
        summary.innerHTML = `
          <span class="rating-avg">★ ${data.avg_rating}</span>
          <span class="rating-count">(${data.review_count} review${data.review_count === 1 ? '' : 's'})</span>`;
      }

      const list = document.getElementById('review-list');
      list.innerHTML = data.reviews.map(r => `
        <div class="review">
          <div class="review-header">
            <span class="review-name">${r.name}</span>
            <span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
          </div>
          ${r.comment ? `<div class="review-comment">${escapeHtml(r.comment)}</div>` : ''}
        </div>`).join('');

      document.getElementById('review-form').style.display = 'flex';
      const myReview = data.reviews.find(r => r.user_id === user.id);
      if (myReview) {
        selectedRating = myReview.rating;
        highlightStars(selectedRating);
        document.getElementById('review-comment').value = myReview.comment || '';
      }
    } catch (err) {
      console.error(err);
    }
  }

  async function submitReview() {
    if (selectedRating === 0) {
      showToast('Please select a star rating.', 'error');
      return;
    }
    const comment = document.getElementById('review-comment').value.trim();
    try {
      const res = await fetch(`${API}/groups/${groupId}/reviews`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ rating: selectedRating, comment })
      });
      const data = await res.json();
      if (!res.ok) return showToast(data.message, 'error');
      showToast('Review saved!', 'success');
      loadReviews();
    } catch (err) {
      showToast('Could not save review.', 'error');
    }
  }

  initStarInput();
  loadGroup();
  loadMessages();
  loadReviews();
</script>
</body>
</html>
