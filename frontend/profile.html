<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Study Group Finder</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.06), transparent 22%),
        radial-gradient(circle at 88% 18%, rgba(255,223,186,0.08), transparent 20%),
        linear-gradient(180deg, #0d1728 0%, #09111d 48%, #04070d 100%);
      color: var(--surface);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      filter: blur(14px);
      opacity: 0.7;
    }

    body::before {
      width: 320px;
      height: 320px;
      top: -90px;
      right: -80px;
      background: radial-gradient(circle, rgba(59,130,246,0.25), transparent 72%);
    }

    body::after {
      width: 280px;
      height: 280px;
      bottom: -70px;
      left: -70px;
      background: radial-gradient(circle, rgba(96,165,250,0.22), transparent 72%);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: linear-gradient(90deg, rgba(8,16,31,0.97), rgba(17,34,62,0.95));
      border-bottom: 1px solid rgba(255,255,255,0.16);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 35px rgba(2,8,23,0.16);
    }

    .logo {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #f8fbff;
    }

    .logo span {
      color: #8cc2ff;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: center;
    }

    .nav-link {
      font-size: 0.95rem;
      color: rgba(248,251,255,0.86);
      text-decoration: none;
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      transition: all 0.18s ease;
    }

    .nav-link.active,
    .nav-link:hover {
      background: rgba(255,255,255,0.16);
      color: #ffffff;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: #dbeafe;
      background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(96,165,250,0.18));
      border: 1px solid rgba(255,255,255,0.18);
    }

    .main {
      max-width: 920px;
      margin: 2rem auto;
      padding: 0 1.5rem 2.5rem;
    }

    .profile-hero,
    .card {
      animation: riseIn 0.45s ease both;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .profile-hero:hover,
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 50px rgba(2,8,23,0.14);
    }

    .profile-hero {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(135deg, rgba(59,130,246,0.16), rgba(255,255,255,0.95));
      border: 1px solid rgba(59,130,246,0.16);
      border-radius: 28px;
      padding: 1.35rem 1.4rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.2rem;
    }

    .profile-hero::before,
    .profile-hero::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      background: rgba(59,130,246,0.14);
    }

    .profile-hero::before {
      width: 180px;
      height: 180px;
      top: -70px;
      right: -50px;
      filter: blur(8px);
    }

    .profile-hero::after {
      width: 140px;
      height: 140px;
      bottom: -60px;
      left: -40px;
      filter: blur(8px);
    }

    .hero-pill {
      display: inline-flex;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: rgba(59,130,246,0.12);
      color: var(--accent-dark);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .page-title {
      font-size: clamp(1.8rem, 2.4vw, 2.6rem);
      font-weight: 800;
      margin-bottom: 0.45rem;
      line-height: 1.05;
    }

    .page-sub {
      color: var(--muted);
      margin-bottom: 0;
      max-width: 48rem;
      line-height: 1.75;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 1.75rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(15,23,42,0.06);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      color: #334155;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.55rem;
    }

    input,
    select {
      width: 100%;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: white;
      padding: 1rem 1rem;
      font-size: 0.96rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .unit-checkbox {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 0;
      color: var(--text);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .unit-checkbox input {
      width: auto;
      margin: 0;
    }

    .hint-text {
      color: #64748b;
      font-size: 0.9rem;
    }

    input:focus,
    select:focus {
      border-color: rgba(51,102,255,0.45);
      box-shadow: 0 0 0 6px rgba(51,102,255,0.1);
    }

    input:disabled {
      background: #f8fafc;
      color: var(--muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 1.25rem;
      border-radius: 18px;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .btn:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .btn-danger {
      border: 1px solid #d64553;
      background: white;
      color: #d64553;
    }

    .btn-danger:hover {
      background: rgba(214,69,83,0.08);
    }

    .success,
    .error {
      padding: 1rem 1rem;
      border-radius: 18px;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    .success {
      background: rgba(31,122,95,0.12);
      color: #164c3b;
    }

    .error {
      background: rgba(214,69,83,0.12);
      color: #9d2f3d;
    }

    .units-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0.85rem;
    }

    .unit-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 18px;
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .unit-item.selected {
      border-color: rgba(51,102,255,0.35);
      background: rgba(51,102,255,0.08);
    }

    .unit-item input {
      width: auto;
      margin: 0;
    }

    .avatar-large {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(51,102,255,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-dark);
      margin-bottom: 0.85rem;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .profile-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text);
    }

    .profile-email {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: rgba(15,23,42,0.96);
      color: white;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      font-size: 0.95rem;
      display: none;
      box-shadow: 0 18px 40px rgba(15,23,42,0.18);
      z-index: 999;
    }

    .toast.success { background: #1f7a5f; }
    .toast.error { background: #d64553; }

    @media (max-width: 760px) {
      .main {
        padding: 0 1rem 2rem;
      }

      .profile-header {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="logo">Study Group <span>Finder</span></div>
  <div class="nav-links">
    <a class="nav-link" href="people.html">Find people</a>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link" href="browse.html">Browse groups</a>
    <a class="nav-link" href="notifications.html">Notifications</a>
    <span class="nav-link active">Profile</span>
    <div class="avatar" id="avatar">?</div>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</nav>

<div class="main">
  <div class="profile-hero">
    <div class="hero-pill">Personal space</div>
    <div class="page-title">My Profile</div>
    <div class="page-sub">Keep your details fresh and make sure your study interests stay aligned with the right groups.</div>
  </div>

  <!-- Profile header -->
  <div class="card">
    <div class="profile-header">
      <div class="avatar-large" id="avatar-large">?</div>
      <div>
        <div class="profile-name" id="profile-name">Loading...</div>
        <div class="profile-email" id="profile-email"></div>
      </div>
    </div>

    <div class="success" id="profile-success"></div>
    <div class="error" id="profile-error"></div>

    <div class="form-group">
      <label>Full name</label>
      <input type="text" id="edit-name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="edit-email" disabled />
    </div>
    <div class="form-group">
      <label>Programme</label>
      <select id="edit-programme">
        <option value="">Select your programme</option>
        <option>Bachelor of Science in Computer Science</option>
        <option>Bachelor of Science in Information Technology</option>
        <option>Bachelor of Science in Electrical Engineering</option>
        <option>Bachelor of Commerce</option>
        <option>Bachelor of Arts in Communication</option>
        <option>Bachelor of Science in Applied Statistics</option>
        <option>Bachelor of Science in Actuarial Science</option>
        <option>Bachelor of Laws (LLB)</option>
        <option>Bachelor of Education</option>
        <option>Bachelor of Arts in Counseling Psychology</option>
      </select>
    </div>
    <div class="form-group">
      <label>Year of study</label>
      <select id="edit-year">
        <option value="1">Year 1</option>
        <option value="2">Year 2</option>
        <option value="3">Year 3</option>
        <option value="4">Year 4</option>
      </select>
    </div>
    <button class="btn" onclick="saveProfile()">Save changes</button>
  </div>

  <!-- Course units -->
  <div class="card">
    <div class="card-title">Enrolled Course Units</div>
    <div class="success" id="units-success"></div>
    <div class="units-grid" id="units-grid">
      <div class="hint-text">Loading units...</div>
    </div>
    <br>
    <button class="btn" onclick="saveUnits()">Update units</button>
  </div>

  <!-- Change password -->
  <div class="card">
    <div class="card-title">Change Password</div>
    <div class="success" id="pw-success"></div>
    <div class="error" id="pw-error"></div>
    <div class="form-group">
      <label>Current password</label>
      <input type="password" id="current-password" placeholder="Enter current password" />
    </div>
    <div class="form-group">
      <label>New password</label>
      <input type="password" id="new-password" placeholder="Min 6 characters" />
    </div>
    <button class="btn" onclick="changePassword()">Change password</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = 'https://study-group-finder-api.onrender.com';
  const token = localStorage.getItem('token');
  let user = JSON.parse(localStorage.getItem('user') || 'null');

  if (!token || !user) window.location.href = 'index.html';

  function getInitials(name) {
    return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
  }

  function loadProfile() {
    document.getElementById('avatar').textContent = getInitials(user.name);
    document.getElementById('avatar-large').textContent = getInitials(user.name);
    document.getElementById('profile-name').textContent = user.name;
    document.getElementById('profile-email').textContent = user.email;
    document.getElementById('edit-name').value = user.name;
    document.getElementById('edit-email').value = user.email;
    document.getElementById('edit-programme').value = user.programme || '';
    document.getElementById('edit-year').value = user.year_of_study || 1;
  }

  async function loadUnits() {
    const fallbackUnits = [
      { id: 101, code: 'CSCI 101', name: 'Introduction to Programming' },
      { id: 102, code: 'CSCI 102', name: 'Data Structures and Algorithms' },
      { id: 103, code: 'CSCI 201', name: 'Discrete Mathematics' },
      { id: 104, code: 'CSCI 202', name: 'Software Engineering' },
      { id: 105, code: 'CSCI 203', name: 'Database Systems' },
      { id: 106, code: 'MATH 101', name: 'Calculus I' },
      { id: 107, code: 'MATH 102', name: 'Calculus II' },
      { id: 108, code: 'STAT 201', name: 'Probability and Statistics' },
      { id: 109, code: 'BUS 201', name: 'Business Communication' },
      { id: 110, code: 'COMM 301', name: 'Media and Society' },
      { id: 111, code: 'ENG 201', name: 'Academic Writing' },
      { id: 112, code: 'PSY 201', name: 'Introduction to Psychology' },
      { id: 113, code: 'LAW 101', name: 'Legal Foundations' },
      { id: 114, code: 'ECON 101', name: 'Microeconomics' },
      { id: 115, code: 'ECON 102', name: 'Macroeconomics' },
      { id: 116, code: 'FIN 201', name: 'Principles of Finance' },
      { id: 117, code: 'MKT 201', name: 'Marketing Principles' },
      { id: 118, code: 'PHYS 101', name: 'Physics I' },
      { id: 119, code: 'CHEM 101', name: 'Chemistry I' },
      { id: 120, code: 'EDU 201', name: 'Teaching and Learning' }
    ];
    try {
      const [allRes, myRes] = await Promise.all([
        fetch(`${API}/units/all`),
        fetch(`${API}/profile/units`, { headers: { 'Authorization': 'Bearer ' + token } })
      ]);
      if (myRes.status === 401) return window.location.href = 'index.html';
      const allData = await allRes.json();
      const myData = await myRes.json();
      const allUnits = Array.isArray(allData.units) && allData.units.length ? allData.units : fallbackUnits;
      const myUnitIds = new Set((myData.units || []).map(u => String(u.id)));

      const grid = document.getElementById('units-grid');
      grid.innerHTML = allUnits.map(u => `
        <label class="unit-item ${myUnitIds.has(String(u.id)) ? 'selected' : ''}" onclick="toggleUnit(this)">
          <input type="checkbox" value="${u.id}" ${myUnitIds.has(String(u.id)) ? 'checked' : ''} />
          <span>${u.code} — ${u.name}</span>
        </label>`).join('');
    } catch (err) { console.error(err); }
  }

  function toggleUnit(label) {
    label.classList.toggle('selected');
  }

  async function saveProfile() {
    const name = document.getElementById('edit-name').value.trim();
    const programme = document.getElementById('edit-programme').value;
    const year_of_study = document.getElementById('edit-year').value;

    document.getElementById('profile-success').style.display = 'none';
    document.getElementById('profile-error').style.display = 'none';

    try {
      const res = await fetch(`${API}/profile`, {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, programme, year_of_study })
      });
      if (res.status === 401) return window.location.href = 'index.html';
      const data = await res.json();
      if (!res.ok) {
        const el = document.getElementById('profile-error');
        el.textContent = data.message;
        el.style.display = 'block';
      } else {
        user = { ...user, name, programme, year_of_study };
        localStorage.setItem('user', JSON.stringify(user));
        document.getElementById('profile-name').textContent = name;
        document.getElementById('avatar').textContent = getInitials(name);
        document.getElementById('avatar-large').textContent = getInitials(name);
        const el = document.getElementById('profile-success');
        el.textContent = 'Profile updated successfully.';
        el.style.display = 'block';
      }
    } catch (err) { showToast('Server error.', 'error'); }
  }

  async function saveUnits() {
    const selected = [...document.querySelectorAll('#units-grid input:checked')].map(cb => Number(cb.value));
    try {
      const res = await fetch(`${API}/profile/units`, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ unit_ids: selected })
      });
      if (res.status === 401) return window.location.href = 'index.html';
      if (res.ok) {
        const el = document.getElementById('units-success');
        el.textContent = 'Course units updated successfully.';
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
      }
    } catch (err) { showToast('Server error.', 'error'); }
  }

  async function changePassword() {
    const current = document.getElementById('current-password').value;
    const newpw = document.getElementById('new-password').value;

    document.getElementById('pw-success').style.display = 'none';
    document.getElementById('pw-error').style.display = 'none';

    if (!current || !newpw) {
      const el = document.getElementById('pw-error');
      el.textContent = 'Please fill in both fields.';
      el.style.display = 'block';
      return;
    }
    if (newpw.length < 6) {
      const el = document.getElementById('pw-error');
      el.textContent = 'New password must be at least 6 characters.';
      el.style.display = 'block';
      return;
    }
    try {
      const res = await fetch(`${API}/profile/password`, {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_password: current, new_password: newpw })
      });
      if (res.status === 401) return window.location.href = 'index.html';
      const data = await res.json();
      if (!res.ok) {
        const el = document.getElementById('pw-error');
        el.textContent = data.message;
        el.style.display = 'block';
      } else {
        const el = document.getElementById('pw-success');
        el.textContent = 'Password changed successfully.';
        el.style.display = 'block';
        document.getElementById('current-password').value = '';
        document.getElementById('new-password').value = '';
      }
    } catch (err) { showToast('Server error.', 'error'); }
  }

  loadProfile();
  loadUnits();
</script>
</body>
</html>
