<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Groups — Study Group Finder</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.06), transparent 22%),
        radial-gradient(circle at 88% 18%, rgba(255,223,186,0.08), transparent 20%),
        linear-gradient(180deg, #0d1728 0%, #09111d 48%, #04070d 100%);
      color: var(--surface);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      filter: blur(14px);
      opacity: 0.7;
    }

    body::before {
      width: 320px;
      height: 320px;
      top: -90px;
      right: -80px;
      background: radial-gradient(circle, rgba(59,130,246,0.25), transparent 72%);
    }

    body::after {
      width: 280px;
      height: 280px;
      bottom: -70px;
      left: -70px;
      background: radial-gradient(circle, rgba(96,165,250,0.22), transparent 72%);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: linear-gradient(90deg, rgba(8,16,31,0.97), rgba(17,34,62,0.95));
      border-bottom: 1px solid rgba(255,255,255,0.16);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 35px rgba(2,8,23,0.16);
    }

    .logo {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #f8fbff;
    }

    .logo span {
      color: #8cc2ff;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: center;
    }

    .nav-link {
      font-size: 0.95rem;
      color: rgba(248,251,255,0.86);
      text-decoration: none;
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      transition: all 0.18s ease;
    }

    .nav-link.active,
    .nav-link:hover {
      background: rgba(255,255,255,0.16);
      color: #ffffff;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: #dbeafe;
      background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(96,165,250,0.18));
      border: 1px solid rgba(255,255,255,0.18);
    }

    .main {
      max-width: 1020px;
      margin: 2rem auto;
      padding: 0 1.5rem 2.5rem;
    }

    .browse-hero,
    .group-card {
      animation: riseIn 0.45s ease both;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .browse-hero:hover,
    .group-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 50px rgba(2,8,23,0.14);
    }

    .browse-hero {
      background: linear-gradient(135deg, rgba(59,130,246,0.16), rgba(255,255,255,0.95));
      border: 1px solid rgba(59,130,246,0.16);
      border-radius: 28px;
      padding: 1.4rem 1.45rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }

    .page-title {
      font-size: clamp(1.7rem, 2.1vw, 2.4rem);
      font-weight: 800;
      margin-bottom: 0.65rem;
      line-height: 1.05;
    }

    .page-sub {
      color: var(--muted);
      margin-bottom: 0;
      max-width: 48rem;
      line-height: 1.75;
    }

    .hero-pill {
      display: inline-flex;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: rgba(59,130,246,0.12);
      color: var(--accent-dark);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr minmax(180px, 260px);
      gap: 0.95rem;
      margin-bottom: 1.75rem;
    }

    .search,
    select {
      width: 100%;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: white;
      padding: 1rem 1rem;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search:focus,
    select:focus {
      border-color: rgba(51,102,255,0.45);
      box-shadow: 0 0 0 6px rgba(51,102,255,0.1);
    }

    .groups {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .group-card {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      min-height: 170px;
    }

    .group-card:hover {
      transform: translateY(-2px);
      border-color: rgba(51,102,255,0.2);
    }

    .group-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.45rem;
      cursor: pointer;
    }

    .group-unit {
      font-size: 0.95rem;
      color: var(--accent);
      margin-bottom: 0.85rem;
    }

    .group-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .badge-open,
    .badge-full,
    .badge-member {
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      font-size: 0.82rem;
      line-height: 1;
      font-weight: 700;
    }

    .badge-open { background: #ecfdf5; color: #166534; }
    .badge-full { background: #fef2f2; color: #991b1b; }
    .badge-member { background: #eff6ff; color: #1d4ed8; }

    .btn-join,
    .btn-full,
    .btn-member,
    .btn-danger-sm {
      min-width: 120px;
      border-radius: 999px;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.18s ease;
    }

    .btn-join {
      background: var(--accent);
      color: white;
      border: none;
    }

    .btn-join:hover {
      background: var(--accent-dark);
    }

    .btn-full,
    .btn-member {
      border: 1px solid rgba(15,23,42,0.08);
      background: rgba(15,23,42,0.04);
      color: var(--muted);
      cursor: default;
    }

    .btn-danger-sm {
      border: 1px solid #d64553;
      color: #d64553;
      background: white;
    }

    .btn-danger-sm:hover {
      background: rgba(214,69,83,0.08);
    }

    .empty {
      background: rgba(255,255,255,0.9);
      border: 1px dashed rgba(15,23,42,0.12);
      border-radius: 24px;
      padding: 1.7rem;
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 999;
      background: rgba(15,23,42,0.96);
      color: white;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      font-size: 0.95rem;
      display: none;
      box-shadow: 0 18px 40px rgba(15,23,42,0.18);
    }

    .toast.success { background: #1f7a5f; }
    .toast.error { background: #d64553; }

    .btn {
      padding: 0.9rem 1.05rem;
      background: var(--accent);
      color: white;
      border-radius: 999px;
      border: none;
    }

    .logout {
      border: none;
      background: transparent;
      color: #d64553;
      cursor: pointer;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .main {
        padding: 0 1rem 1.5rem;
      }

      .filters,
      .groups {
        grid-template-columns: 1fr;
      }

      .group-card {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="logo">Study Group <span>Finder</span></div>
  <div class="nav-links">
    <a class="nav-link" href="people.html">Find people</a>
    <a class="nav-link" href="profile.html">Profile</a>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <span class="nav-link active">Browse groups</span>
    <a class="nav-link" href="create-group.html">+ Create group</a>
    <div class="avatar" id="avatar">?</div>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</nav>

<div class="main">
  <div class="browse-hero">
    <div class="hero-pill">Discover</div>
    <div class="page-title">Browse study groups</div>
    <div class="page-sub">Find and join groups for your course units with a more focused, intentional study circle.</div>
  </div>

  <div class="filters">
    <input class="search" id="search" placeholder="Search by group name..." oninput="filterGroups()" />
    <select id="unit-filter" onchange="loadGroups()">
      <option value="">All units</option>
    </select>
  </div>

  <div class="groups" id="groups-container">
    <div class="empty">Loading groups...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://study-group-finder-api.onrender.com';
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || 'null');

if (!token || !user) window.location.href = 'index.html';

document.getElementById('avatar').textContent = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = 'index.html';
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

const fallbackUnits = [
  { id: 101, code: 'CSCI 101', name: 'Introduction to Programming' },
  { id: 102, code: 'CSCI 102', name: 'Data Structures and Algorithms' },
  { id: 103, code: 'CSCI 201', name: 'Discrete Mathematics' },
  { id: 104, code: 'CSCI 202', name: 'Software Engineering' },
  { id: 105, code: 'CSCI 203', name: 'Database Systems' },
  { id: 106, code: 'MATH 101', name: 'Calculus I' },
  { id: 107, code: 'MATH 102', name: 'Calculus II' },
  { id: 108, code: 'STAT 201', name: 'Probability and Statistics' },
  { id: 109, code: 'BUS 201', name: 'Business Communication' },
  { id: 110, code: 'COMM 301', name: 'Media and Society' },
  { id: 111, code: 'ENG 201', name: 'Academic Writing' },
  { id: 112, code: 'PSY 201', name: 'Introduction to Psychology' },
  { id: 113, code: 'LAW 101', name: 'Legal Foundations' },
  { id: 114, code: 'ECON 101', name: 'Microeconomics' },
  { id: 115, code: 'ECON 102', name: 'Macroeconomics' },
  { id: 116, code: 'FIN 201', name: 'Principles of Finance' },
  { id: 117, code: 'MKT 201', name: 'Marketing Principles' },
  { id: 118, code: 'PHYS 101', name: 'Physics I' },
  { id: 119, code: 'CHEM 101', name: 'Chemistry I' },
  { id: 120, code: 'EDU 201', name: 'Teaching and Learning' }
];

let allGroups = [];
let myGroupIds = new Set();

async function loadGroups() {
  const unit = document.getElementById('unit-filter').value;
  const url = unit ? `${API}/groups?unit=${encodeURIComponent(unit)}` : `${API}/groups`;
  const headers = { 'Authorization': 'Bearer ' + token };

  try {
    const groupsRes = await fetch(url, { headers });
    if (groupsRes.status === 401) return window.location.href = 'index.html';
    const groupsData = await groupsRes.json();

    const myRes = await fetch(`${API}/groups/my`, { headers });
    if (myRes.status === 401) return window.location.href = 'index.html';
    const myData = await myRes.json();

    myGroupIds = new Set((myData.groups || []).map(g => String(g.id)));
    allGroups = (groupsData.groups || []).map(g => ({
      ...g,
      isMember: myGroupIds.has(String(g.id))
    }));

    renderGroups(allGroups);
  } catch (err) {
    console.error('loadGroups error:', err);
    document.getElementById('groups-container').innerHTML = '<div class="empty">Failed to load groups.</div>';
  }
}

async function loadUnits() {
  const sel = document.getElementById('unit-filter');
  sel.innerHTML = '<option value="">All units</option>';
  try {
    const res = await fetch(`${API}/units`, { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) return window.location.href = 'index.html';
    const data = await res.json();
    const units = Array.isArray(data.units) && data.units.length ? data.units : fallbackUnits;
    units.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.code;
      opt.textContent = u.code + ' — ' + u.name;
      sel.appendChild(opt);
    });
  } catch (err) {
    fallbackUnits.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.code;
      opt.textContent = u.code + ' — ' + u.name;
      sel.appendChild(opt);
    });
  }
}

function filterGroups() {
  const search = document.getElementById('search').value.toLowerCase();
  const filtered = allGroups.filter(g => g.name.toLowerCase().includes(search));
  renderGroups(filtered);
}

function renderGroups(groups) {
  const gc = document.getElementById('groups-container');
  if (!groups || groups.length === 0) {
    gc.innerHTML = '<div class="empty">No groups found. <a class="text-link" href="create-group.html">Create one?</a></div>';
    return;
  }
  gc.innerHTML = groups.map(g => {
    const count = parseInt(g.member_count) || 0;
    const isFull = count >= g.max_members;
    let badge = isFull
      ? '<span class="badge-full">Full</span>'
      : '<span class="badge-open">Open</span>';
    let btn = '';
    if (g.isMember) {
      badge = '<span class="badge-member">Joined</span>';
      btn = `<button class="btn-danger-sm" onclick="leaveGroup(${g.id}, this)">Leave</button>`;
    } else if (isFull) {
      btn = '<button class="btn-full" disabled>Full</button>';
    } else {
      btn = `<button class="btn-join" onclick="joinGroup(${g.id}, this)">Join group</button>`;
    }
    return `
      <div class="group-card">
        <div>
          <div class="group-name" onclick="window.location.href='group.html?id=${g.id}'">${g.name}</div>
          <div class="group-unit">${g.unit_code} — ${g.unit_name}</div>
          ${g.avg_rating ? `<div class="group-rating">★ ${g.avg_rating} (${g.review_count})</div>` : ''}
          <div class="group-meta">
            <span>👥 ${count} / ${g.max_members}</span>
            <span>📅 ${g.schedule || 'TBD'}</span>
            <span>📍 ${g.venue || 'TBD'}</span>
            ${badge}
          </div>
        </div>
        ${btn}
      </div>`;
  }).join('');
}

async function joinGroup(id, btn) {
  btn.disabled = true;
  btn.textContent = 'Joining...';
  try {
    const res = await fetch(`${API}/groups/${id}/join`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if (!res.ok) {
      showToast(data.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Join group';
    } else {
      showToast('Joined successfully!', 'success');
      loadGroups();
    }
  } catch (err) {
    showToast('Could not connect to server.', 'error');
    btn.disabled = false;
    btn.textContent = 'Join group';
  }
}
async function leaveGroup(id, btn) {
  if (!confirm('Are you sure you want to leave this group?')) return;
  btn.disabled = true;
  btn.textContent = 'Leaving...';
  try {
    const res = await fetch(`${API}/groups/${id}/leave`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if (!res.ok) {
      showToast(data.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Leave';
    } else {
      showToast('You have left the group.', 'success');
      loadGroups();
    }
  } catch (err) {
    showToast('Could not connect to server.', 'error');
    btn.disabled = false;
    btn.textContent = 'Leave';
  }
}

loadUnits();
loadGroups();
</script>
